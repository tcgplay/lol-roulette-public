name: Enable GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Serve the repo from branch main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          HDR=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          SETTINGS="https://github.com/${GITHUB_REPOSITORY}/settings/pages"

          get_code=$(curl -sS -o /tmp/pages-get.json -w "%{http_code}" "${HDR[@]}" "$API")
          echo "GET /pages -> ${get_code}"
          cat /tmp/pages-get.json || true
          echo

          if [ "$get_code" = "200" ]; then
            put_code=$(curl -sS -o /tmp/pages-put.json -w "%{http_code}" -X PUT "${HDR[@]}" "$API" \
              -d '{"build_type":"legacy","source":{"branch":"main","path":"/"}}')
            echo "PUT /pages -> ${put_code}"
            cat /tmp/pages-put.json || true
            if [ "$put_code" = "200" ] || [ "$put_code" = "204" ]; then
              echo "Pages source is main /"
              exit 0
            fi
          else
            post_code=$(curl -sS -o /tmp/pages-post.json -w "%{http_code}" -X POST "${HDR[@]}" "$API" \
              -d '{"source":{"branch":"main","path":"/"}}')
            echo "POST /pages -> ${post_code}"
            cat /tmp/pages-post.json || true
            if [ "$post_code" = "201" ] || [ "$post_code" = "409" ]; then
              echo "Pages site created from main /"
              exit 0
            fi
          fi

          echo "::error::Could not enable GitHub Pages from Actions (token cannot change Pages settings)."
          echo "::error::Open ${SETTINGS} → Source: Deploy from a branch → Branch: main → Folder: / (root) → Save."
          echo "::error::The site is https://tcgplay.github.io/lol-roulette-public/"
          exit 1
