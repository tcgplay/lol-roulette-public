name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble app-only publish directory
        run: |
          mkdir -p publish/parties
          cp index.html party-list.html csv-guide.html license.html LICENSE start.bat start.ps1 enabled-store.js robots.txt publish/
          cp parties/*.csv publish/parties/
          touch publish/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish
      - id: deployment
        uses: actions/deploy-pages@v4
